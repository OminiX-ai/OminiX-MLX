[package]
name = "gemma4-mlx"
version = "0.1.0"
edition = "2021"
description = "Gemma 4 text-only inference on Apple Silicon with MLX"
license = "MIT OR Apache-2.0"

[dependencies]
mlx-rs = { path = "../mlx-rs", features = ["metal", "accelerate"] }
mlx-rs-core = { path = "../mlx-rs-core" }
mlx-sys = { path = "../mlx-rs/mlx-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.21"

[[example]]
name = "chat_gemma4"
path = "examples/chat_gemma4.rs"

[[example]]
name = "tool_chat_gemma4"
path = "examples/tool_chat_gemma4.rs"

[[example]]
name = "repro_chat"
path = "examples/repro_chat.rs"

[[example]]
name = "test_e4b_coherence"
path = "examples/test_e4b_coherence.rs"

